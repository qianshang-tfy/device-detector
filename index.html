<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<title>设备检测 | Device Detector</title>


<style>

/* =========================
   颜色
   ========================= */

:root {

    --bg: #f2f2f7;

    --card: rgba(255,255,255,.88);

    --text: #1c1c1e;

    --secondary: #6e6e73;

    --line: rgba(0,0,0,.08);

    --blue: #007aff;

    --green: #34c759;

    --orange: #ff9500;

    --red: #ff3b30;

}


@media (prefers-color-scheme: dark) {

    :root {

        --bg: #000;

        --card: rgba(28,28,30,.90);

        --text: #f5f5f7;

        --secondary: #98989f;

        --line: rgba(255,255,255,.10);

    }

}


/* =========================
   基础
   ========================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html {

    background: var(--bg);

}


body {

    margin: 0;

    min-height: 100vh;

    background:

        radial-gradient(
            circle at 50% -10%,
            rgba(0,122,255,.18),
            transparent 42%
        ),

        var(--bg);

    color: var(--text);

    font-family:

        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

}


/* =========================
   主容器
   ========================= */

.container {

    width: min(
        760px,
        calc(100% - 28px)
    );

    margin: auto;

    padding:

        max(
            25px,
            env(safe-area-inset-top)
        )

        0

        max(
            35px,
            env(safe-area-inset-bottom)
        );

}


/* =========================
   标题
   ========================= */

.header {

    text-align: center;

    padding: 20px 0 22px;

}


.header h1 {

    margin: 0;

    font-size: 32px;

    letter-spacing: -.8px;

}


.header p {

    margin: 7px 0 0;

    color: var(--secondary);

    font-size: 14px;

}


/* =========================
   主结果
   ========================= */

.hero {

    position: relative;

    overflow: hidden;

    background: var(--card);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    border-radius: 30px;

    padding: 42px 20px 35px;

    text-align: center;

    box-shadow:

        0 15px 45px
        rgba(0,0,0,.10);

}


.hero::before {

    content: "";

    position: absolute;

    width: 220px;

    height: 220px;

    border-radius: 50%;

    background:

        rgba(0,122,255,.10);

    top: -130px;

    left: 50%;

    transform:
        translateX(-50%);

}


.icon {

    position: relative;

    font-size: 72px;

    line-height: 1;

    margin-bottom: 18px;

}


.system {

    font-size: 34px;

    font-weight: 750;

    letter-spacing: -.8px;

}


.device {

    margin-top: 7px;

    font-size: 18px;

    color: var(--secondary);

}


.badge {

    display: inline-block;

    margin-top: 16px;

    padding: 7px 13px;

    border-radius: 999px;

    background:

        rgba(52,199,89,.12);

    color: var(--green);

    font-size: 13px;

    font-weight: 600;

}


/* =========================
   卡片
   ========================= */

.card {

    margin-top: 16px;

    background: var(--card);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    border-radius: 22px;

    padding: 20px;

    box-shadow:

        0 7px 25px
        rgba(0,0,0,.06);

}


.card h2 {

    margin: 0 0 8px;

    font-size: 18px;

}


/* =========================
   信息行
   ========================= */

.row {

    display: flex;

    justify-content: space-between;

    gap: 20px;

    padding: 14px 0;

    border-bottom:
        1px solid var(--line);

}


.row:last-child {

    border-bottom: none;

}


.label {

    color: var(--secondary);

    flex-shrink: 0;

}


.value {

    text-align: right;

    word-break: break-word;

}


/* =========================
   可信度颜色
   ========================= */

.high {

    color: var(--green);

    font-weight: 600;

}


.medium {

    color: var(--orange);

    font-weight: 600;

}


.low {

    color: var(--secondary);

}


/* =========================
   User-Agent
   ========================= */

.ua {

    margin-top: 12px;

    padding: 14px;

    border-radius: 14px;

    background:

        rgba(120,120,128,.10);

    color: var(--secondary);

    font-size: 12px;

    line-height: 1.6;

    word-break: break-all;

}


/* =========================
   按钮
   ========================= */

button {

    width: 100%;

    margin-top: 16px;

    border: none;

    border-radius: 16px;

    padding: 15px;

    background: var(--blue);

    color: white;

    font-size: 17px;

    font-weight: 600;

}


button:active {

    opacity: .65;

    transform: scale(.99);

}


/* =========================
   页脚
   ========================= */

.footer {

    text-align: center;

    color: var(--secondary);

    font-size: 12px;

    margin-top: 22px;

    line-height: 1.7;

}


/* =========================
   手机
   ========================= */

@media (max-width: 450px) {

    .system {

        font-size: 29px;

    }

    .row {

        flex-direction: column;

        gap: 4px;

    }

    .value {

        text-align: left;

    }

}


/* =========================
   桌面
   ========================= */

@media (min-width: 700px) {

    .container {

        padding-top: 45px;

    }

    .hero {

        padding: 50px 30px 40px;

    }

}

</style>

</head>

<script>

/* =====================================================
   Device Detector V3
   ===================================================== */

(function () {

"use strict";


/* =========================
   安全输出
   ========================= */

function text(id, value) {

    var element =
        document.getElementById(id);

    if (element) {

        element.textContent =
            value;

    }

}


/* =========================
   User-Agent
   ========================= */

function getUA() {

    try {

        return navigator.userAgent || "";

    }

    catch (e) {

        return "";

    }

}


/* =========================
   Platform
   ========================= */

function getPlatform() {

    try {

        return navigator.platform || "";

    }

    catch (e) {

        return "";

    }

}


/* =========================
   Touch
   ========================= */

function getTouchPoints() {

    try {

        return Number(
            navigator.maxTouchPoints || 0
        );

    }

    catch (e) {

        return 0;

    }

}


/* =========================
   iOS 版本
   ========================= */

function getIOSVersion(ua) {

    var match =
        ua.match(
            /OS (\d+)[._](\d+)(?:[._](\d+))?/i
        );


    if (!match) {

        return "未知";

    }


    var result =
        match[1] +
        "." +
        match[2];


    if (match[3]) {

        result +=
            "." +
            match[3];

    }


    return result;

}


/* =========================
   Android 版本
   ========================= */

function getAndroidVersion(ua) {

    var match =
        ua.match(
            /Android[ \/]([\d.]+)/i
        );


    return match
        ? match[1]
        : "未知";

}


/* =========================
   浏览器
   ========================= */

function getBrowser(ua) {

    var match;


    if (
        (match =
            ua.match(
                /CriOS\/([\d.]+)/i
            ))
    ) {

        return "Chrome " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /FxiOS\/([\d.]+)/i
            ))
    ) {

        return "Firefox " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /EdgiOS\/([\d.]+)/i
            ))
    ) {

        return "Edge " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /Edg\/([\d.]+)/i
            ))
    ) {

        return "Edge " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /OPR\/([\d.]+)/i
            ))
    ) {

        return "Opera " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /Chrome\/([\d.]+)/i
            ))
    ) {

        return "Chrome " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /Firefox\/([\d.]+)/i
            ))
    ) {

        return "Firefox " +
               match[1];

    }


    if (
        (match =
            ua.match(
                /Version\/([\d.]+).*Safari/i
            ))
    ) {

        return "Safari " +
               match[1];

    }


    return "未知浏览器";

}


/* =====================================================
   型号识别
   ===================================================== */

function detectModel(
    isIPad,
    isIPhone,
    isIPod,
    isAndroid
) {


    var result = {

        model: "无法确定",

        confidence: "低",

        reason:
            "浏览器没有提供足够的硬件型号信息"

    };


    var w =
        Math.min(
            screen.width,
            screen.height
        );


    var h =
        Math.max(
            screen.width,
            screen.height
        );


    var dpr =
        window.devicePixelRatio || 1;


    /* =========================
       iPad
       ========================= */

    if (isIPad) {


        /*
         * iPad 2
         *
         * 1024 × 768
         * DPR 1
         */

        if (
            w === 768 &&
            h === 1024 &&
            dpr <= 1.1
        ) {

            result.model =
                "iPad 2 / 早期 9.7 英寸 iPad";

            result.confidence =
                "较高";

            result.reason =
                "768 × 1024 + 1×";

        }


        /*
         * 9.7 Retina
         */

        else if (
            w === 768 &&
            h === 1024 &&
            dpr >= 1.8
        ) {

            result.model =
                "9.7 英寸 Retina iPad";

            result.confidence =
                "中";

            result.reason =
                "768 × 1024 + 2×";

        }


        /*
         * 10.2
         */

        else if (
            w === 810 &&
            h === 1080
        ) {

            result.model =
                "10.2 英寸 iPad";

            result.confidence =
                "较高";

            result.reason =
                "810 × 1080";

        }


        /*
         * 10.5
         */

        else if (
            w === 834 &&
            h === 1112
        ) {

            result.model =
                "10.5 英寸 iPad";

            result.confidence =
                "较高";

            result.reason =
                "834 × 1112";

        }


        /*
         * 11 英寸
         */

        else if (
            w === 834 &&
            h === 1194
        ) {

            result.model =
                "11 英寸 iPad Pro";

            result.confidence =
                "较高";

            result.reason =
                "834 × 1194";

        }


        /*
         * 12.9
         */

        else if (
            w === 1024 &&
            h === 1366
        ) {

            result.model =
                "12.9 英寸 iPad Pro";

            result.confidence =
                "较高";

            result.reason =
                "1024 × 1366";

        }


        else {

            result.model =
                "iPad（具体型号未知）";

            result.confidence =
                "低";

            result.reason =
                "确认是 iPad，但无法进一步确定型号";

        }

    }


    /* =========================
       iPhone
       ========================= */

    else if (isIPhone) {


        /*
         * 3.5 英寸
         *
         * iPhone 4
         * iPhone 4S
         */

        if (
            w === 320 &&
            h === 480
        ) {

            result.model =
                "3.5 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "320 × 480";

        }


        /*
         * 4 英寸
         *
         * iPhone 5
         * 5c
         * 5s
         * SE
         */

        else if (
            w === 320 &&
            h === 568
        ) {

            result.model =
                "4 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "320 × 568";

        }


        /*
         * 4.7 英寸
         *
         * iPhone 6
         * 6s
         * 7
         * 8
         * SE 2
         * SE 3
         */

        else if (
            w === 375 &&
            h === 667
        ) {

            result.model =
                "4.7 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "375 × 667 pt";

        }


        /*
         * 5.5 Plus
         */

        else if (
            w === 414 &&
            h === 736
        ) {

            result.model =
                "5.5 英寸 iPhone Plus";

            result.confidence =
                "较高";

            result.reason =
                "414 × 736 pt";

        }


        /*
         * X / XS / 11 Pro
         */

        else if (
            w === 375 &&
            h === 812
        ) {

            result.model =
                "5.8 英寸全面屏 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "375 × 812 pt";

        }


        /*
         * XR / 11
         */

        else if (
            w === 414 &&
            h === 896
        ) {

            result.model =
                "6.1 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "414 × 896 pt";

        }


        /*
         * 其他
         */

        else {

            result.model =
                "iPhone（具体型号未知）";

            result.confidence =
                "低";

            result.reason =
                "确认是 iPhone，但特征不足";

        }

    }


    /* =========================
       iPod
       ========================= */

    else if (isIPod) {

        result.model =
            "iPod touch";

        result.confidence =
            "中";

        result.reason =
            "User-Agent 明确包含 iPod";

    }


    /* =========================
       Android
       ========================= */

    else if (isAndroid) {

        result.model =
            "Android 设备";

        result.confidence =
            "低";

        result.reason =
            "Android 浏览器通常不会可靠提供硬件型号";

    }


    return result;

}


/* =====================================================
   主函数
   ===================================================== */

window.detectDevice =
function () {


    try {


        var ua =
            getUA();


        var platform =
            getPlatform();


        var touch =
            getTouchPoints();


        var os =
            "未知系统";


        var version =
            "未知";


        var device =
            "未知设备";


        var type =
            "未知";


        var icon =
            "❓";


        /* =========================
           判断 Apple
           ========================= */


        var isIPad =
            /iPad/i.test(ua) ||

            (
                platform === "MacIntel" &&
                touch > 1
            );


        var isIPhone =
            /iPhone/i.test(ua);


        var isIPod =
            /iPod/i.test(ua);


        var isAndroid =
            /Android/i.test(ua);


        /* =========================
           iPad
           ========================= */

        if (isIPad) {

            os =
                "iPadOS";

            version =
                getIOSVersion(ua);

            device =
                "iPad";

            type =
                "平板电脑";

            icon =
                "🍎";

        }


        /* =========================
           iPhone
           ========================= */

        else if (isIPhone) {

            os =
                "iOS";

            version =
                getIOSVersion(ua);

            device =
                "iPhone";

            type =
                "智能手机";

            icon =
                "🍎";

        }


        /* =========================
           iPod
           ========================= */

        else if (isIPod) {

            os =
                "iOS";

            version =
                getIOSVersion(ua);

            device =
                "iPod touch";

            type =
                "便携设备";

            icon =
                "🍎";

        }


        /* =========================
           Android
           ========================= */

        else if (isAndroid) {

            os =
                "Android";

            version =
                getAndroidVersion(ua);

            icon =
                "🤖";


            if (
                /Mobile/i.test(ua)
            ) {

                device =
                    "Android 手机";

                type =
                    "智能手机";

            }

            else {

                device =
                    "Android 平板";

                type =
                    "平板电脑";

            }

        }


        /* =========================
           Windows
           ========================= */

        else if (
            /Windows/i.test(ua)
        ) {

            os =
                "Windows";

            device =
                "Windows PC";

            type =
                "电脑";

            icon =
                "🪟";

        }


        /* =========================
           ChromeOS
           ========================= */

        else if (
            /CrOS/i.test(ua)
        ) {

            os =
                "ChromeOS";

            device =
                "Chromebook";

            type =
                "电脑";

            icon =
                "💻";

        }


        /* =========================
           macOS
           ========================= */

        else if (
            /Mac OS X/i.test(ua)
        ) {

            os =
                "macOS";

            device =
                "Mac";

            type =
                "电脑";

            icon =
                "🍎";

        }


        /* =========================
           Linux
           ========================= */

        else if (
            /Linux/i.test(ua)
        ) {

            os =
                "Linux";

            device =
                "Linux PC";

            type =
                "电脑";

            icon =
                "🐧";

        }


        /* =========================
           ChromeOS 二次确认
           ========================= */

        if (
            /CrOS/i.test(ua)
        ) {

            os =
                "ChromeOS";

            device =
                "Chromebook";

            type =
                "电脑";

            icon =
                "💻";

        }


        /* =========================
           型号
           ========================= */

        var modelInfo =
            detectModel(
                isIPad,
                isIPhone,
                isIPod,
                isAndroid
            );


        /* =========================
           输出主结果
           ========================= */

        text(
            "icon",
            icon
        );


        text(
            "system",
            os
        );


        text(
            "device",
            device
        );


        text(
            "badge",
            "✓ 检测完成"
        );


        /* =========================
           系统
           ========================= */

        text(
            "os",
            os
        );


        text(
            "version",
            version
        );


        text(
            "type",
            type
        );


        text(
            "browser",
            getBrowser(ua)
        );


        /* =========================
           型号
           ========================= */

        text(
            "model",
            modelInfo.model
        );


        text(
            "confidence",
            modelInfo.confidence
        );


        text(
            "reason",
            modelInfo.reason
        );


        /* =========================
           可信度颜色
           ========================= */

        var confidenceElement =
            document.getElementById(
                "confidence"
            );


        if (
            confidenceElement
        ) {

            confidenceElement.className =
                "value";


            if (
                modelInfo.confidence ===
                "较高"
            ) {

                confidenceElement.className +=
                    " high";

            }

            else if (
                modelInfo.confidence ===
                "中"
            ) {

                confidenceElement.className +=
                    " medium";

            }

            else {

                confidenceElement.className +=
                    " low";

            }

        }


        /* =========================
           屏幕
           ========================= */

        text(
            "resolution",

            screen.width +
            " × " +
            screen.height +
            " px"
        );


        /* =========================
           DPR
           ========================= */

        text(
            "dpr",

            window.devicePixelRatio ||
            1
        );


        /* =========================
           Touch
           ========================= */

        text(
            "touch",

            touch
        );


        /* =========================
           方向
           ========================= */

        var orientation;


        if (
            window.innerWidth >
            window.innerHeight
        ) {

            orientation =
                "横屏";

        }

        else {

            orientation =
                "竖屏";

        }


        text(
            "orientation",
            orientation
        );


        /* =========================
           Platform
           ========================= */

        text(
            "platform",

            platform ||
            "未知"
        );


        /* =========================
           在线
           ========================= */

        text(
            "online",

            navigator.onLine
                ? "在线"
                : "离线"
        );


        /* =========================
           Cookie
           ========================= */

        text(
            "cookie",

            navigator.cookieEnabled
                ? "已启用"
                : "已禁用"
        );


        /* =========================
           UA
           ========================= */

        text(
            "ua",

            ua ||
            "无法读取 User-Agent"
        );


    }

    catch (error) {


        console.error(
            "Device Detector:",
            error
        );


        text(
            "system",
            "检测失败"
        );


        text(
            "device",
            "浏览器不支持部分功能"
        );


        text(
            "badge",
            "⚠ 检测失败"
        );


    }

};


/* =====================================================
   启动
   ===================================================== */

if (
    document.readyState ===
    "loading"
) {


    document.addEventListener(
        "DOMContentLoaded",

        window.detectDevice

    );


}

else {


    window.detectDevice();


}


/* =====================================================
   监听屏幕旋转
   ===================================================== */

window.addEventListener(
    "resize",

    function () {

        var orientation;


        if (
            window.innerWidth >
            window.innerHeight
        ) {

            orientation =
                "横屏";

        }

        else {

            orientation =
                "竖屏";

        }


        text(
            "orientation",
            orientation
        );


        text(
            "resolution",

            screen.width +
            " × " +
            screen.height +
            " px"
        );


    }

);


})();

</script>


</body>

</html>
