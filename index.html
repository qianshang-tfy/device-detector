<title>设备检测 - Device Detector</title>


<style>

/* =====================================================
   基础颜色
   ===================================================== */

html,
body {

    margin: 0;
    padding: 0;

    background: #f2f2f7;

    color: #1c1c1e;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

}


body {

    min-width: 280px;

}


/* =====================================================
   主容器
   ===================================================== */

.container {

    width: 94%;

    max-width: 720px;

    margin: 0 auto;

    padding-top: 20px;

    padding-bottom: 40px;

}


/* =====================================================
   标题
   ===================================================== */

.header {

    text-align: center;

    margin-bottom: 18px;

}


.header h1 {

    margin: 0;

    font-size: 30px;

    line-height: 38px;

}


.header p {

    margin: 4px 0 0;

    color: #8e8e93;

    font-size: 14px;

}


/* =====================================================
   主结果
   ===================================================== */

.hero {

    background: #ffffff;

    border-radius: 22px;

    padding: 30px 15px;

    text-align: center;

    margin-bottom: 14px;

    border: 1px solid #e5e5ea;

    box-shadow:
        0 5px 20px rgba(0,0,0,.07);

}


.icon {

    font-size: 58px;

    line-height: 65px;

    margin-bottom: 10px;

}


.system {

    font-size: 30px;

    line-height: 38px;

    font-weight: bold;

}


.device {

    margin-top: 5px;

    color: #8e8e93;

    font-size: 17px;

}


.badge {

    display: inline-block;

    margin-top: 12px;

    padding: 6px 12px;

    border-radius: 20px;

    background: #e8f8ed;

    color: #34a853;

    font-size: 13px;

}


/* =====================================================
   卡片
   ===================================================== */

.card {

    background: #ffffff;

    border-radius: 18px;

    padding: 15px 17px;

    margin-bottom: 14px;

    border: 1px solid #e5e5ea;

    box-shadow:
        0 3px 14px rgba(0,0,0,.05);

}


.card h2 {

    margin: 0;

    padding-bottom: 4px;

    font-size: 18px;

}


/* =====================================================
   信息行
   ===================================================== */

.row {

    position: relative;

    min-height: 22px;

    padding: 12px 0;

    border-bottom:
        1px solid #eeeeF2;

}


.row:last-child {

    border-bottom: none;

}


.label {

    display: block;

    color: #8e8e93;

    font-size: 14px;

    line-height: 20px;

}


.value {

    display: block;

    margin-top: 2px;

    color: #1c1c1e;

    font-size: 15px;

    line-height: 21px;

    word-wrap: break-word;

    word-break: break-all;

}


/* =====================================================
   可信度
   ===================================================== */

.high {

    color: #34a853;

    font-weight: bold;

}


.medium {

    color: #ff9500;

    font-weight: bold;

}


.low {

    color: #8e8e93;

}


/* =====================================================
   数据库信息
   ===================================================== */

.database {

    background: #f7f7f9;

    border-radius: 12px;

    padding: 12px;

    margin-top: 10px;

}


.database-title {

    font-size: 14px;

    color: #8e8e93;

    margin-bottom: 8px;

}


/* =====================================================
   User Agent
   ===================================================== */

.ua {

    margin-top: 8px;

    padding: 11px;

    background: #f2f2f7;

    border-radius: 10px;

    color: #6e6e73;

    font-size: 11px;

    line-height: 17px;

    word-break: break-all;

}


/* =====================================================
   按钮
   ===================================================== */

.detect-button {

    display: block;

    width: 100%;

    height: 48px;

    border: 0;

    border-radius: 14px;

    background: #007aff;

    color: #ffffff;

    font-size: 17px;

    font-weight: bold;

    margin-top: 4px;

    -webkit-appearance: none;

}


.detect-button:active {

    background: #005fc7;

}


/* =====================================================
   页脚
   ===================================================== */

.footer {

    text-align: center;

    color: #8e8e93;

    font-size: 12px;

    line-height: 20px;

    margin-top: 20px;

}


/* =====================================================
   深色模式
   ===================================================== */

@media screen and (prefers-color-scheme: dark) {

    html,
    body {

        background: #000000;

        color: #f5f5f7;

    }


    .hero,
    .card {

        background: #1c1c1e;

        border-color: #2c2c2e;

    }


    .label,
    .device,

        color: #98989f;

    }


    .value,
    .system {

        color: #f5f5f7;

    }


    .row {

        border-color: #2c2c2e;

    }


    .database,
    .ua {

        background: #2c2c2e;

    }


    .ua {

        color: #98989f;

    }

}


/* =====================================================
   大屏
   ===================================================== */

@media screen and (min-width: 700px) {

    .container {

        padding-top: 40px;

    }


    .hero {

        padding-top: 40px;

        padding-bottom: 40px;

    }


    .row {

        min-height: 24px;

    }


    .label {

        display: inline-block;

        width: 35%;

        vertical-align: top;

    }


    .value {

        display: inline-block;

        width: 62%;

        margin-top: 0;

        text-align: right;

        vertical-align: top;

    }

}


/* =====================================================
   iPhone 小屏
   ===================================================== */

@media screen and (max-width: 360px) {

    .container {

        width: 92%;

    }


    .hero {

        padding: 24px 12px;

    }


    .system {

        font-size: 26px;

    }


    .card {

        padding-left: 13px;

        padding-right: 13px;

    }

}

<script>

/* =====================================================
   Device Detector V4
   Legacy Safari Compatible
   ES5 JavaScript
   ===================================================== */

(function () {

"use strict";


/* =====================================================
   简单文本输出
   ===================================================== */

function setText(id, value) {

    var element =
        document.getElementById(id);

    if (element) {

        element.innerHTML = "";

        element.appendChild(
            document.createTextNode(
                String(value)
            )
        );

    }

}


/* =====================================================
   UA
   ===================================================== */

function getUA() {

    return navigator.userAgent || "";

}


/* =====================================================
   Platform
   ===================================================== */

function getPlatform() {

    return navigator.platform || "";

}


/* =====================================================
   Touch
   ===================================================== */

function getTouch() {

    return navigator.maxTouchPoints || 0;

}


/* =====================================================
   iOS 版本
   ===================================================== */

function getIOSVersion(ua) {

    var match =
        ua.match(
            /OS (\d+)[._](\d+)(?:[._](\d+))?/i
        );


    if (!match) {

        return "未知";

    }


    var result =
        match[1] +
        "." +
        match[2];


    if (match[3]) {

        result +=
            "." +
            match[3];

    }


    return result;

}


/* =====================================================
   Android 版本
   ===================================================== */

function getAndroidVersion(ua) {

    var match =
        ua.match(
            /Android[ \/]([\d.]+)/i
        );


    if (match) {

        return match[1];

    }


    return "未知";

}


/* =====================================================
   浏览器
   ===================================================== */

function getBrowser(ua) {

    var match;


    if (
        (match =
            ua.match(
                /CriOS\/([\d.]+)/i
            ))
    ) {

        return "Chrome " + match[1];

    }


    if (
        (match =
            ua.match(
                /FxiOS\/([\d.]+)/i
            ))
    ) {

        return "Firefox " + match[1];

    }


    if (
        (match =
            ua.match(
                /EdgiOS\/([\d.]+)/i
            ))
    ) {

        return "Edge " + match[1];

    }


    if (
        (match =
            ua.match(
                /Chrome\/([\d.]+)/i
            ))
    ) {

        return "Chrome " + match[1];

    }


    if (
        (match =
            ua.match(
                /Firefox\/([\d.]+)/i
            ))
    ) {

        return "Firefox " + match[1];

    }


    if (
        (match =
            ua.match(
                /Version\/([\d.]+).*Safari/i
            ))
    ) {

        return "Safari " + match[1];

    }


    return "未知浏览器";

}


/* =====================================================

   ===================================================== */

var appleDatabase = {


    "ipad2":

function showAppleDatabase(key) {

/* =====================================================
   隐藏 Apple 数据库
   ===================================================== */

function hideAppleDatabase() {

        document.getElementById(
            "appleDatabase"
        );


    if (box) {

        box.style.display =
            "none";

    }

}


/* =====================================================
   型号检测
   ===================================================== */

function detectModel(
    isIPad,
    isIPhone,
    isIPod,
    isAndroid
) {


    var result = {

        model: "无法确定",

        confidence: "低",

        reason:
            "浏览器没有提供足够的硬件型号信息",

        database: null

    };


    var w =
        Math.min(
            screen.width,
            screen.height
        );


    var h =
        Math.max(
            screen.width,
            screen.height
        );


    var dpr =
        window.devicePixelRatio || 1;


    /* =================================================
       iPad
       ================================================= */

    if (isIPad) {


        /*
         * iPad 2
         */

        if (
            w === 768 &&
            h === 1024 &&
            dpr <= 1.1
        ) {

            result.model =
                "iPad 2";

            result.confidence =
                "较高";

            result.reason =
                "768 × 1024，DPR 约 1";

            result.database =
                "ipad2";

        }


        /*
         * Retina 9.7
         */

        else if (
            w === 768 &&
            h === 1024 &&
            dpr >= 1.8
        ) {

            result.model =
                "9.7 英寸 Retina iPad";

            result.confidence =
                "中";

            result.reason =
                "768 × 1024，DPR 约 2";

        }


        /*
         * 10.2
         */

        else if (
            w === 810 &&
            h === 1080
        ) {

            result.model =
                "10.2 英寸 iPad";

            result.confidence =
                "较高";

            result.reason =
                "810 × 1080";

        }


        /*
         * 10.5
         */

        else if (
            w === 834 &&
            h === 1112
        ) {

            result.model =
                "10.5 英寸 iPad";

            result.confidence =
                "较高";

            result.reason =
                "834 × 1112";

        }


        /*
         * 11
         */

        else if (
            w === 834 &&
            h === 1194
        ) {

            result.model =
                "11 英寸 iPad Pro";

            result.confidence =
                "较高";

            result.reason =
                "834 × 1194";

        }


        /*
         * 12.9
         */

        else if (
            w === 1024 &&
            h === 1366
        ) {

            result.model =
                "12.9 英寸 iPad Pro";

            result.confidence =
                "较高";

            result.reason =
                "1024 × 1366";

        }


        else {

            result.model =
                "iPad（具体型号未知）";

            result.confidence =
                "低";

            result.reason =
                "确认是 iPad，但特征不足";

        }

    }


    /* =================================================
       iPhone
       ================================================= */

    else if (isIPhone) {


        /*
         * 3.5
         */

        if (
            w === 320 &&
            h === 480
        ) {

            result.model =
                "3.5 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "320 × 480";

            /*
             * iOS 6 设备中
             * 可能是 iPhone 4 / 4S
             */

        }


        /*
         * 4 英寸
         */

        else if (
            w === 320 &&
            h === 568
        ) {

            result.model =
                "4 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "320 × 568";

        }


        /*
         * 4.7
         */

        else if (
            w === 375 &&
            h === 667
        ) {

            result.model =
                "4.7 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "375 × 667";

            result.database =
                "iphone6";

        }


        /*
         * 5.5
         */

        else if (
            w === 414 &&
            h === 736
        ) {

            result.model =
                "5.5 英寸 iPhone Plus";

            result.confidence =
                "较高";

            result.reason =
                "414 × 736";

            result.database =
                "iphone6plus";

        }


        /*
         * X 系列
         */

        else if (
            w === 375 &&
            h === 812
        ) {

            result.model =
                "5.8 英寸全面屏 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "375 × 812";

        }


        /*
         * XR / 11
         */

        else if (
            w === 414 &&
            h === 896
        ) {

            result.model =
                "6.1 英寸 iPhone";

            result.confidence =
                "较高";

            result.reason =
                "414 × 896";

        }


        else {

            result.model =
                "iPhone（具体型号未知）";

            result.confidence =
                "低";

            result.reason =
                "确认是 iPhone，但特征不足";

        }

    }


    /* =================================================
       iPod
       ================================================= */

    else if (isIPod) {

        result.model =
            "iPod touch";

        result.confidence =
            "中";

        result.reason =
            "User-Agent 明确包含 iPod";

    }


    /* =================================================
       Android
       ================================================= */

    else if (isAndroid) {

        result.model =
            "Android 设备";

        result.confidence =
            "低";

        result.reason =
            "Android 浏览器通常不会可靠提供硬件型号";

    }


    return result;

}


/* =====================================================
   主检测函数
   ===================================================== */

function detectDevice() {


    try {


        hideAppleDatabase();


        var ua =
            getUA();


        var platform =
            getPlatform();


        var touch =
            getTouch();


        var isIPad =
            /iPad/i.test(ua) ||

            (
                platform === "MacIntel" &&
                touch > 1
            );


        var isIPhone =
            /iPhone/i.test(ua);


        var isIPod =
            /iPod/i.test(ua);


        var isAndroid =
            /Android/i.test(ua);


        var os =
            "未知系统";


        var version =
            "未知";


        var device =
            "未知设备";


        var type =
            "未知";


        var icon =
            "📱";


        /* =================================================
           iPad
           ================================================= */

        if (isIPad) {

            os =
                "iPadOS";

            version =
                getIOSVersion(ua);

            device =
                "iPad";

            type =
                "平板电脑";

            icon =
                "";

        }


        /* =================================================
           iPhone
           ================================================= */

        else if (isIPhone) {

            os =
                "iOS";

            version =
                getIOSVersion(ua);

            device =
                "iPhone";

            type =
                "智能手机";

            icon =
                "";

        }


        /* =================================================
           iPod
           ================================================= */

        else if (isIPod) {

            os =
                "iOS";

            version =
                getIOSVersion(ua);

            device =
                "iPod touch";

            type =
                "便携设备";

            icon =
                "";

        }


        /* =================================================
           Android
           ================================================= */

        else if (isAndroid) {

            os =
                "Android";

            version =
                getAndroidVersion(ua);

            icon =
                "🤖";


            if (
                /Mobile/i.test(ua)
            ) {

                device =
                    "Android 手机";

                type =
                    "智能手机";

            }

            else {

                device =
                    "Android 平板";

                type =
                    "平板电脑";

            }

        }


        /* =================================================
           Windows
           ================================================= */

        else if (
            /Windows/i.test(ua)
        ) {

            os =
                "Windows";

            device =
                "Windows PC";

            type =
                "电脑";

            icon =
                "💻";

        }


        /* =================================================
           ChromeOS
           ================================================= */

        else if (
            /CrOS/i.test(ua)
        ) {

            os =
                "ChromeOS";

            device =
                "Chromebook";

            type =
                "电脑";

            icon =
                "💻";

        }


        /* =================================================
           macOS
           ================================================= */

        else if (
            /Mac OS X/i.test(ua)
        ) {

            os =
                "macOS";

            device =
                "Mac";

            type =
                "电脑";

            icon =
                "";

        }


        /* =================================================
           Linux
           ================================================= */

        else if (
            /Linux/i.test(ua)
        ) {

            os =
                "Linux";

            device =
                "Linux PC";

            type =
                "电脑";

            icon =
                "🐧";

        }


        /* =================================================
           Apple 型号
           ================================================= */

        var modelInfo =
            detectModel(
                isIPad,
                isIPhone,
                isIPod,
                isAndroid
            );


        /* =================================================
           主结果
           ================================================= */

        setText(
            "icon",
            icon
        );


        setText(
            "system",
            os
        );


        setText(
            "device",
            device
        );


        setText(
            "badge",
            "✓ 检测完成"
        );


        /* =================================================
           系统
           ================================================= */

        setText(
            "os",
            os
        );


        setText(
            "version",
            version
        );


        setText(
            "type",
            type
        );


        setText(
            "browser",
            getBrowser(ua)
        );


        /* =================================================
           型号
           ================================================= */

        setText(
            "model",
            modelInfo.model
        );


        setText(
            "confidence",
            modelInfo.confidence
        );


        setText(
            "reason",
            modelInfo.reason
        );


        /* =================================================
           可信度颜色
           ================================================= */

        var confidence =
            document.getElementById(
                "confidence"
            );


        if (confidence) {

            confidence.className =
                "value";


            if (
                modelInfo.confidence ===
                "较高"
            ) {

                confidence.className +=
                    " high";

            }

            else if (
                modelInfo.confidence ===
                "中"
            ) {

                confidence.className +=
                    " medium";

            }

            else {

                confidence.className +=
                    " low";

            }

        }


        /* =================================================
           Apple 数据库
           ================================================= */

        if (
            modelInfo.database
        ) {

            showAppleDatabase(
                modelInfo.database
            );

        }


        /* =================================================
           硬件
           ================================================= */

        setText(
            "resolution",

            screen.width +
            " × " +
            screen.height +
            " px"
        );


        setText(
            "dpr",

            window.devicePixelRatio ||
            1
        );


        setText(
            "touch",

            touch
        );


        /* =================================================
           方向
           ================================================= */

        var orientation;


        if (
            window.innerWidth >
            window.innerHeight
        ) {

            orientation =
                "横屏";

        }

        else {

            orientation =
                "竖屏";

        }


        setText(
            "orientation",
            orientation
        );


        /* =================================================
           浏览器环境
           ================================================= */

        setText(
            "platform",

            platform ||
            "未知"
        );


        setText(
            "online",

            navigator.onLine
                ? "在线"
                : "离线"
        );


        setText(
            "cookie",

            navigator.cookieEnabled
                ? "已启用"
                : "已禁用"
        );


        /* =================================================
           UA
           ================================================= */

        setText(
            "ua",

            ua ||
            "无法读取 User-Agent"
        );


    }

    catch (error) {


        setText(
            "system",
            "检测失败"
        );


        setText(
            "device",
            "浏览器不支持部分功能"
        );


        setText(
            "badge",
            "⚠ 检测失败"
        );


    }

}


/* =====================================================
   初始化
   ===================================================== */

function init() {


    var button =
        document.getElementById(
            "detectButton"
        );


    if (button) {

        button.onclick =
            detectDevice;

    }


    detectDevice();

}


/* =====================================================
   老 Safari 兼容初始化
   ===================================================== */

if (
    document.readyState ===
    "complete" ||
    document.readyState ===
    "interactive"
) {

    setTimeout(
        init,
        0
    );

}

else if (
    document.addEventListener
) {

    document.addEventListener(
        "DOMContentLoaded",
        init,
        false
    );

}

else {

    window.attachEvent(
        "onload",
        init
    );

}


/* =====================================================
   旋转/尺寸变化
   ===================================================== */

if (
    window.addEventListener
) {

    window.addEventListener(
        "resize",
        function () {

            var orientation;


            if (
                window.innerWidth >
                window.innerHeight
            ) {

                orientation =
                    "横屏";

            }

            else {

                orientation =
                    "竖屏";

            }


            setText(
                "orientation",
                orientation
            );


            setText(
                "resolution",

                screen.width +
                " × " +
                screen.height +
                " px"
            );

        },
        false
    );

}


})();

</script>


</body>

</html>
